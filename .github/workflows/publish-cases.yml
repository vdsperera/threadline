name: Publish Scheduled Cases

on:
  schedule:
    # Runs at 13:30 UTC (19:00 IST) every Monday and Wednesday
    - cron: '30 13 * * 1,3'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of cases to publish'
        required: false
        default: '1'
      dry_run:
        description: 'Perform a dry run without moving files, committing, or deploying'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    name: Publish from Queue
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      case_id: ${{ steps.publish.outputs.case_id }}
      case_title: ${{ steps.publish.outputs.case_title }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish case from queue
        id: publish
        run: |
          node scripts/publish-case.mjs ${{ inputs.dry_run && '--dry-run' || '' }} --count ${{ inputs.count || 1 }}

      - name: Commit and push changes
        if: steps.publish.outputs.published == 'true' && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cases/ queue/
          git commit -m "content(cases): publish ${{ steps.publish.outputs.case_title }} [skip ci]"
          git push origin main

  build-and-deploy:
    name: Build & Deploy to GitHub Pages
    needs: publish
    if: needs.publish.outputs.published == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install, build, and upload site
        uses: withastro/action@v3
        with:
          node-version: 22

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
